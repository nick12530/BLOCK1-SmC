<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#151d2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle grid lines -->
  <line x1="96" y1="180" x2="416" y2="180" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="96" y1="260" x2="416" y2="260" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="96" y1="340" x2="416" y2="340" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Candlesticks -->
  <line x1="160" y1="220" x2="160" y2="360" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <rect x="146" y="250" width="28" height="80" rx="4" fill="#ef4444"/>

  <line x1="256" y1="160" x2="256" y2="380" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <rect x="238" y="200" width="36" height="120" rx="6" fill="url(#gold)" filter="url(#glow)"/>

  <line x1="352" y1="120" x2="352" y2="300" stroke="url(#emerald)" stroke-width="6" stroke-linecap="round"/>
  <rect x="338" y="150" width="28" height="100" rx="4" fill="url(#emerald)"/>

  <!-- Gold Bullion Emblem Accent -->
  <circle cx="256" cy="420" r="16" fill="url(#gold)" filter="url(#glow)"/>
</svg>
